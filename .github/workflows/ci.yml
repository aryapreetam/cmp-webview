name: Reusable CI (lint, build+tests, android UI)

on:
  workflow_call:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  lint:
    name: Lint and code style
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Check code style (lint) and API binary compatibility
        run: ./gradlew lintRelease :cmp-webview:apiCheck

  lib-tests:
    name: Library+Sample tests (${{ matrix.target }})
    needs: [ lint ]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: jvm
            os: ubuntu-24.04
          - target: ios
            os: macos-latest
          - target: wasm
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-
      - name: Setup Node.js (for wasm)
        if: matrix.target == 'wasm'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Check for preinstalled Chrome/Chromium
        if: matrix.target == 'wasm'
        id: chromecheck
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=$(command -v google-chrome)" >> $GITHUB_OUTPUT
            exit 0
          fi
          if command -v chromium-browser >/dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=$(command -v chromium-browser)" >> $GITHUB_OUTPUT
            exit 0
          fi
          if command -v chromium >/dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=$(command -v chromium)" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "found=false" >> $GITHUB_OUTPUT
      - name: Setup Chrome for wasm tests
        if: matrix.target == 'wasm' && steps.chromecheck.outputs.found == 'false'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Export CHROME_BIN for wasm tests
        if: matrix.target == 'wasm'
        run: |
          if [ "${{ steps.chromecheck.outputs.found }}" = "true" ]; then
            echo "CHROME_BIN=${{ steps.chromecheck.outputs.path }}" >> $GITHUB_ENV
          elif [ -n "$CHROME_PATH" ]; then
            echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
          fi
      - name: Cache Kotlin/Native (~/.konan)
        if: matrix.target == 'ios'
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Cache Kotlin JS Store
        if: matrix.target == 'wasm'
        uses: actions/cache@v4
        with:
          path: kotlin-js-store
          key: kjs-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: kjs-${{ runner.os }}-

      # Desktop/JVM integration tests use Swing/AWT (via KCEF/JCEF) and need a display on Linux.
      - name: Install Xvfb (Linux, JVM tests)
        if: matrix.target == 'jvm'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # Compose Desktop / Skiko tests can crash on Ubuntu runners if common GUI/GL deps are missing.
      # Install a baseline set of libraries typically required by Chromium/Skia.
      - name: Install Linux desktop deps (Linux, JVM tests)
        if: matrix.target == 'jvm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnss3 \
            libx11-6 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            libxshmfence1 \
            libxss1 \
            mesa-utils

      # KCEF downloads a Chromium bundle on first run. Cache it so JVM tests are faster and less flaky.
      - name: Cache KCEF bundle (Chromium)
        if: matrix.target == 'jvm'
        uses: actions/cache@v4
        with:
          path: |
            ~/kcef-bundle
          key: kcef-bundle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            kcef-bundle-${{ runner.os }}-
      - name: Grant Gradlew execute permission
        run: chmod +x gradlew
      - name: Run library + sample target tests
        shell: bash
        run: |
          set -e
          case "${{ matrix.target }}" in
            jvm)
              xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
                env \
                  LIBGL_ALWAYS_SOFTWARE=1 \
                  SKIKO_RENDER_API=SOFTWARE \
                  ./gradlew :cmp-webview:jvmTest :sample:composeApp:jvmTest --stacktrace
              ;;
            ios)
              ./gradlew :cmp-webview:iosSimulatorArm64Test :sample:composeApp:iosSimulatorArm64Test
              ;;
            wasm)
              ./gradlew :cmp-webview:wasmJsBrowserTest :sample:composeApp:wasmJsBrowserTest
              ;;
          esac

      - name: Upload JVM test reports (on failure)
        if: failure() && matrix.target == 'jvm'
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: |
            cmp-webview/build/reports/tests
            sample/composeApp/build/reports/tests
            **/hs_err_pid*.log
          retention-days: 7

  test-android-unit:
    name: Android unit tests (lib + sample)
    runs-on: ubuntu-24.04
    needs: [ lint ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run Android unit tests
        run: ./gradlew :cmp-webview:testAndroid :sample:androidApp:testDebugUnitTest

  e2e-desktop-wasm:
    name: Parikshan E2E (JVM + Wasm)
    runs-on: ubuntu-24.04
    needs: [ lib-tests ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Install WebKitGTK (Linux JVM WebView dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0
      - name: Setup Desktop E2E Environment
        uses: aryapreetam/parikshan-desktop-action@v1
        with:
          command: 'echo "Desktop setup complete."'
      - name: Setup WASM E2E Environment
        uses: aryapreetam/parikshan-wasm-action@v1
        with:
          command: 'echo "WASM setup complete."'
      - name: Run Parikshan E2E (JVM + Wasm)
        run: |
          xvfb-run ./gradlew :sample:composeApp:e2eTest --targets=jvm,wasm --app-mode -Dparikshan.video.enabled=true --no-configuration-cache
      - name: Upload Desktop & Wasm Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-desktop-wasm-results
          path: |
            sample/composeApp/build/parikshan/videos/
            sample/composeApp/build/parikshan/screenshots/
            sample/composeApp/build/parikshan/*.log
            sample/composeApp/build/parikshan/logs/
            sample/composeApp/build/reports/tests/
            sample/composeApp/build/reports/problems/
          if-no-files-found: ignore

  e2e-android:
    name: Parikshan E2E (Android)
    runs-on: ubuntu-24.04
    needs: [ lib-tests, test-android-unit ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run Parikshan Android E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :sample:composeApp:e2eAndroidTest -Dparikshan.video.enabled=true --no-configuration-cache
      - name: Upload Android Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-android-results
          path: |
            sample/composeApp/build/parikshan/videos/android/
            sample/composeApp/build/parikshan/screenshots/
            sample/composeApp/build/parikshan/*.log
            sample/composeApp/build/parikshan/logs/
            sample/composeApp/build/reports/tests/
          if-no-files-found: ignore

  e2e-ios:
    name: Parikshan E2E (iOS Simulator ARM64)
    runs-on: macos-latest
    needs: [ lib-tests ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: List Available Simulators
        run: xcrun simctl list devices available
      - name: Pre-boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '.devices[] | select(type == "array") | .[] | select(.name == "iPhone 16" or .name == "iPhone 17") | .udid' | head -n 1)
          if [ -n "$DEVICE_ID" ]; then
            echo "Pre-booting simulator $DEVICE_ID"
            xcrun simctl boot "$DEVICE_ID" || true
            xcrun simctl bootstatus "$DEVICE_ID" -b || true
          fi
      - name: Pre-compile Kotlin Native Framework
        run: |
          ./gradlew :sample:composeApp:linkDebugFrameworkIosSimulatorArm64 \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" \
            -Pparikshan.e2e.active=true
      - name: Run Parikshan iOS E2E tests
        run: |
          ./gradlew :sample:composeApp:e2eIosTest \
            -Dparikshan.video.enabled=true \
            --no-configuration-cache \
            --no-build-cache \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" \
            -Dparikshan.xcodebuild.timeout=1800
      - name: Upload iOS Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-ios-results
          path: |
            sample/composeApp/build/parikshan/videos/ios/
            sample/composeApp/build/parikshan/screenshots/
            sample/composeApp/build/parikshan/*.log
            sample/composeApp/build/parikshan/logs/
            sample/composeApp/build/reports/tests/
          if-no-files-found: ignore
